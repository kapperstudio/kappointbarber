<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BarberGo — Reservasi Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
 --blue:#0B2FD1;--blue2:#2563EB;--bluesoft:#E8F0FF;--bk:#0F172A;
 --bg:#F8FAFC;--card:#FFFFFF;--tx:#0F172A;--tx2:#64748B;--tx3:#94A3B8;
 --bd:#E2E8F0;--line:#EDF2F7;--hov:#F1F5F9;--soft2:#F1F5F9;--selbg:#E8F0FF;
 --gr:#16A34A;--wn:#F59E0B;--dn:#EF4444;
 --r:14px;--sh:0 1px 3px rgba(15,23,42,.05)
}
body.dark{--bg:#0A1020;--card:#0F172A;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--bd:#1E293B;--line:#182338;--hov:#16213A;--soft2:#1E293B;--selbg:rgba(37,99,235,.2);--sh:0 1px 3px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:#CBD5E1 var(--bg)}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,47,209,.14)}
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin:13px 0 6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
svg.lucide,i[data-lucide]{width:16px;height:16px;flex:none}
a{color:inherit;text-decoration:none}
.lgmk{display:block}.lgmk .lgA{fill:var(--bk)}body.dark .lgmk .lgA{fill:#F1F5F9}.lgmk .lgB{fill:var(--blue)}
.wordmark{font:800 15px 'Plus Jakarta Sans',Inter,sans-serif;color:var(--tx);letter-spacing:-.01em;display:inline-flex;align-items:center}
.wordmark .wdot{width:6px;height:6px;background:var(--blue);border-radius:2px;margin-left:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:12.5px;border-radius:9px;height:38px;padding:0 16px;transition:.15s}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue2)}
.btn.pri:disabled{opacity:.5;cursor:not-allowed}
.btn.gho{border:1px solid var(--bd);background:var(--card);color:var(--tx)}.btn.gho:hover{border-color:var(--blue);color:var(--blue)}
.btn.lg{height:48px;font-size:14px;border-radius:10px;width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:11.5px}
.ibtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);transition:.15s;flex:none;background:var(--card)}
.ibtn:hover{color:var(--blue);border-color:var(--blue)}
.ibtn svg{width:14px;height:14px}
.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.b-pend{background:rgba(245,158,11,.12);color:#B45309}
.b-paid{background:rgba(22,163,74,.1);color:#16A34A}
.b-can{background:rgba(239,68,68,.1);color:var(--dn)}
.b-gold{background:var(--selbg);color:var(--blue)}
body.dark .b-gold{color:#93B4FF}
.b-gray{background:var(--soft2);color:var(--tx2)}
/* ===== LOGIN ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
 radial-gradient(600px 300px at 15% 0%,rgba(11,47,209,.08),transparent 60%),
 radial-gradient(500px 300px at 90% 100%,rgba(37,99,235,.07),transparent 60%),var(--bg)}
.lg-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.08);padding:34px 30px;text-align:center;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lg-box .lgmk{width:52px;height:52px;margin:0 auto 14px}
.lg-box h1{font:700 22px 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em;margin-bottom:6px}
.lg-box p{font-size:12.5px;color:var(--tx2);margin-bottom:24px;line-height:1.6}
.gbtn{width:100%;height:48px;border-radius:11px;border:1px solid var(--bd);background:#fff;color:#1f1f1f;font:600 13.5px Inter;display:flex;align-items:center;justify-content:center;gap:11px;transition:.15s;cursor:pointer}
.gbtn:hover{border-color:#c4c9d0;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.gbtn:disabled{opacity:.6;cursor:wait}
.gbtn img{width:19px;height:19px}
.lg-foot{font-size:10.5px;color:var(--tx3);margin-top:20px;line-height:1.7}
/* ===== LAYOUT ===== */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;background:var(--card);display:flex;flex-direction:column;z-index:70}
.sb-logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;flex:none}
.sb-tag{font:700 9px Inter;letter-spacing:.14em;color:var(--blue);background:var(--selbg);padding:3px 8px;border-radius:99px}
#navList{flex:1;overflow-y:auto;padding:10px 12px}
.nitem{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 13px;border-radius:10px;color:var(--tx2);font-size:13px;font-weight:600;position:relative;text-align:left;transition:.12s;margin-bottom:3px}
.nitem svg{width:17px;height:17px}
.nitem:hover{background:var(--hov);color:var(--tx)}
.nitem.active{background:var(--selbg);color:var(--blue)}
.nitem.active svg{color:var(--blue)}
.nitem.active::before{content:'';position:absolute;left:0;top:11px;width:3px;height:20px;border-radius:2px;background:var(--blue)}
.nbadge{min-width:18px;height:18px;border-radius:99px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto}
.nsec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin:14px 12px 6px}
.sb-foot{padding:12px;flex:none;position:relative}
.profbtn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:12px;text-align:left;transition:.12s}
.profbtn:hover{background:var(--hov)}
.pav{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.profbtn b{font-size:12.5px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profbtn small{font-size:10.5px;color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profbtn .chev{margin-left:auto;color:var(--tx3);transition:transform .2s}
.profwrap.open .chev{transform:rotate(180deg)}
/* dropdown */
.dd{position:relative}
.dd-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);z-index:90;display:none;overflow:hidden;animation:ddIn .15s ease}
.dd.up.open .dd-menu{display:block}
.dd.down .dd-menu{bottom:auto;top:calc(100% + 8px);left:auto;right:0;width:210px}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{display:flex;gap:10px;align-items:center;padding:11px 14px;font-size:12.5px;font-weight:600;width:100%;text-align:left;transition:.12s}
.dd-item:hover{background:var(--hov)}
.dd-item.dng{color:var(--dn)}
.dd-sep{height:1px;background:var(--bd);margin:4px 0}
/* main */
.main{margin-left:246px;min-height:100vh}
#mhead{display:none;height:58px;background:var(--card);align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:60;border-bottom:1px solid var(--bd)}
#view{padding:26px 30px 60px;max-width:1180px;margin:0 auto;animation:vin .25s ease}
.phead{margin-bottom:20px}
.phead h1{font:700 23px 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em}
.phead p{font-size:12.5px;color:var(--tx2);margin-top:2px}
/* floating mobile nav */
#fnav{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:99px;box-shadow:0 10px 34px rgba(15,23,42,.22);padding:6px;z-index:80;gap:2px}
#fnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 10px;border-radius:99px;font-size:9.5px;font-weight:700;color:var(--tx2);position:relative;transition:.15s}
#fnav button svg{width:18px;height:18px}
#fnav button.on{background:var(--blue);color:#fff}
#fnav .nbadge{position:absolute;top:2px;right:8px;min-width:15px;height:15px;font-size:9px}
/* search */
.srch{position:relative;max-width:520px}
.srch>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tx3);pointer-events:none}
.srch input{height:42px;padding-left:38px;border-radius:11px}
/* CTA */
.cta{position:relative;border-radius:16px;overflow:hidden;margin:18px 0 24px;border:1px solid var(--bd);min-height:150px;display:flex}
.cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,15,26,.88) 0%,rgba(11,47,209,.55) 60%,rgba(11,47,209,.2) 100%)}
.cta-in{position:relative;z-index:2;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px;max-width:70%}
.cta-in b{font:800 19px 'Plus Jakarta Sans',Inter,sans-serif;color:#fff;letter-spacing:-.01em}
.cta-in span{font-size:12px;color:rgba(255,255,255,.85)}
.cta-in .btn{margin-top:10px;align-self:flex-start;background:#fff;color:var(--blue)}
.cta-in .btn:hover{background:var(--bluesoft,#E8F0FF)}
/* shop cards */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.lhead h3{font:700 15px 'Plus Jakarta Sans',Inter,sans-serif}
.lhead small{font-size:11px;color:var(--tx3)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;cursor:pointer;display:flex;flex-direction:column}
.scard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.1)}
.scover{height:132px;background:linear-gradient(120deg,#0B2FD1,#2563EB);position:relative}
.scover img{width:100%;height:100%;object-fit:cover;display:block}
.scover .pl{position:absolute;top:10px;left:10px}
.sbody{padding:0 16px 14px;display:flex;flex-direction:column;flex:1}
.srow{display:flex;align-items:flex-end;gap:12px;margin-top:-24px;position:relative;z-index:2}
.sava{width:52px;height:52px;border-radius:14px;background:var(--card);border:3px solid var(--card);box-shadow:0 3px 10px rgba(15,23,42,.14);overflow:hidden;display:flex;align-items:center;justify-content:center;font:800 18px 'Plus Jakarta Sans';color:#fff;background:var(--blue);flex:none}
.sava img{width:100%;height:100%;object-fit:cover}
.sname{font:700 15px 'Plus Jakarta Sans',Inter,sans-serif;line-height:1.2;margin-bottom:2px;min-width:0}
.saddr{font-size:11.5px;color:var(--tx2);display:flex;gap:5px;align-items:center;margin-top:5px;line-height:1.4}
.saddr svg{width:12px;height:12px;flex:none}
.smeta{display:flex;align-items:center;gap:9px;margin:11px 0 4px}
.stk{display:flex}
.stk .st1{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);overflow:hidden;margin-left:-8px;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tx2)}
.stk .st1:first-child{margin-left:0}
.stk .st1 img{width:100%;height:100%;object-fit:cover}
.smeta small{font-size:11px;color:var(--tx3)}
.sthumbs{display:flex;gap:6px;margin-left:auto}
.sthumbs img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--bd)}
.sacts{display:flex;gap:8px;margin-top:10px}
.sacts .btn{flex:1;height:36px;font-size:12px}
.empty{padding:44px 16px;text-align:center;color:var(--tx3)}
.empty svg{width:32px;height:32px;margin-bottom:8px;opacity:.5}
.empty p{font-size:12.5px;line-height:1.6}
/* modal / scrim / push */
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#modalRoot{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modalRoot.on{display:flex}
.modal{background:var(--card);border-radius:18px;border:1px solid var(--bd);max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:22px;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{font:700 16px 'Plus Jakarta Sans',Inter,sans-serif;margin-bottom:2px}
.modal .msub{font-size:12px;color:var(--tx2);margin-bottom:8px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#pushStack{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:9px;width:330px;max-width:calc(100vw - 24px)}
.push{display:flex;gap:11px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 13px 14px;box-shadow:0 12px 32px rgba(15,23,42,.2);animation:pIn .3s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.push.out{opacity:0;transform:translateX(30px) scale(.97);transition:.25s ease}
@keyframes pIn{from{opacity:0;transform:translateX(40px) scale(.96)}to{opacity:1;transform:none}}
.push .pic{width:35px;height:35px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--blue);color:#fff}
.push .pic svg{width:16px;height:16px}
.push .pt{flex:1;min-width:0}
.push .pt b{display:block;font-size:12.5px;font-weight:700}
.push .pt span{display:block;font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.45}
.push .px{flex:none;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.push .px:hover{background:var(--hov);color:var(--tx)}
.push .prog{position:absolute;left:0;bottom:0;height:3px;width:100%}
.push .prog i{display:block;height:100%;background:var(--blue);animation:prog linear forwards}
@keyframes prog{from{width:100%}to{width:0}}
.push:hover .prog i{animation-play-state:paused}
/* detail */
.dcover{height:150px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#0B2FD1,#2563EB);margin-bottom:0}
.dcover img{width:100%;height:100%;object-fit:cover}
.dhead{display:flex;align-items:flex-end;gap:12px;margin-top:-26px;position:relative;z-index:2;padding:0 4px}
.dava{width:56px;height:56px;border-radius:14px;border:3px solid var(--card);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:800 19px 'Plus Jakarta Sans';overflow:hidden;flex:none;box-shadow:0 3px 10px rgba(15,23,42,.15)}
.dava img{width:100%;height:100%;object-fit:cover}
.blk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);margin:18px 0 8px}
.galrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.galrow img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.caprow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
.caprow:last-child{border-bottom:none}
.caprow .cdot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
.cav{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx2);flex:none}
.cav img{width:100%;height:100%;object-fit:cover}
.caprow b{font-size:12.5px;display:block}
.caprow small{font-size:11px;color:var(--tx2)}
.svcrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.svcrow:last-child{border-bottom:none}
.svcrow .pr{font-family:'JetBrains Mono';font-weight:700}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.chatlist{flex:1;overflow-y:auto}
.thr{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:12px;text-align:left;transition:.12s}
.thr:hover{background:var(--hov)}
.thr b{font-size:13px;display:block}
.thr small{font-size:11.5px;color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.thr .tm{margin-left:auto;text-align:right;flex:none}
.thr .tm small{max-width:none}
.unb{min-width:17px;height:17px;border-radius:99px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.room{display:flex;flex-direction:column;flex:1;min-height:0}
.cr-head{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.cr-back{display:none}
.msgs{flex:1;overflow-y:auto;padding:16px 4px;display:flex;flex-direction:column;gap:8px;background:var(--hov);border-radius:14px;margin:12px 0}
.bub{max-width:74%;padding:9px 13px;border-radius:13px;font-size:12.5px;line-height:1.5;width:fit-content}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.cust{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bub .bt{display:block;font-size:9px;opacity:.55;margin-top:3px;text-align:right}
.chat-inp{display:flex;gap:9px}
.chat-inp input{flex:1}
/* history */
.hrow{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .in{flex:1;min-width:0}
.hrow .in b{font-size:13px;display:block}
.hrow .in small{font-size:11.5px;color:var(--tx2)}
.hrow .amt{font-family:'JetBrains Mono';font-size:12px;color:var(--tx3);flex:none}
/* loading */
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sk{height:250px;border-radius:16px;background:linear-gradient(90deg,var(--soft2) 25%,var(--hov) 50%,var(--soft2) 75%);background-size:200% 100%;animation:shm 1.1s infinite}
@keyframes shm{to{background-position:-200% 0}}
/* toast area (inline confirm) */
.okbox{display:flex;gap:10px;align-items:flex-start;background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.4);border-radius:10px;padding:12px 14px;margin-top:12px;color:var(--gr);font-size:12.5px;font-weight:600}
/* responsive */
@media(max-width:768px){
 #sidebar{display:none}
 .main{margin-left:0}
 #mhead{display:flex}
 #fnav{display:flex}
 #view{padding:16px 14px 110px}
 .cr-back{display:inline-flex!important}
 .cta-in{max-width:100%}
}
</style>
</head>
<body>

<!-- ============ LOGIN (Google saja) ============ -->

  <div class="lg-box">

async function cloudUpload(file){
 const fd=new FormData();
 fd.append('file',file);fd.append('upload_preset',CLOUD_PRESET);fd.append('folder','barbergo-customers');
 const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 if(!j.secure_url)throw new Error((j.error&&j.error.message)||'respons tidak valid');
 return j.secure_url;
}

/* ================= PUSH ================= */
function push(o){
 o=Object.assign({icon:'bell',title:'',sub:'',action:'',dur:4800,onClick:null,silent:false},o);
 const stack=qs('#pushStack');if(!stack)return;
 while(stack.children.length>=3)stack.firstElementChild.remove();
 const el=document.createElement('div');el.className='push';
 el.innerHTML=`<span class="pic"><i data-lucide="${o.icon}"></i></span>
  <span class="pt"><b>${esc(o.title)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}${o.action?`<span style="display:block;font-size:11px;font-weight:700;color:var(--blue);margin-top:5px">${esc(o.action)} →</span>`:''}</span>
  <button class="px"><i data-lucide="x"></i></button>
  <span class="prog"><i style="animation-duration:${o.dur}ms"></i></span>`;
 function kill(){el.classList.add('out');setTimeout(()=>el.remove(),260)}
 el.querySelector('.px').addEventListener('click',e=>{e.stopPropagation();kill()});
 el.addEventListener('click',()=>{o.onClick&&o.onClick();kill()});
 el.querySelector('.prog i').addEventListener('animationend',kill);
 stack.appendChild(el);refreshIcons();
}
function toast(msg,icon='check-circle-2',err=false){
 const el=push({icon:err?'alert-triangle':icon,title:msg,dur:3000,silent:true});
 if(err){const p=el.querySelector('.pic');if(p)p.style.background='var(--dn)'}
}

function ddClose(){qsa('.dd.open').forEach(x=>x.classList.remove('open'))}
document.addEventListener('click',e=>{qsa('.dd.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')})});

/* ================= PROFIL CUSTOMER ================= */
async function ensureProfile(u){
 const ref=dbFS.collection('customers_app').doc(u.uid);
 const snap=await ref.get().catch(()=>null);
 if(snap&&snap.exists){
  ME=Object.assign({name:'',email:u.email,phone:'',photo:''},snap.data());
  ME.email=ME.email||u.email;
  if(!ME.name&&u.displayName)ME.name=u.displayName;
  if(!ME.photo&&u.photoURL)ME.photo=u.photoURL;
  await ref.set({name:ME.name,email:ME.email,photo:ME.photo},{merge:true});
 }else{
  ME={name:u.displayName||'Pelanggan',email:u.email||'',phone:'',photo:u.photoURL||''};
  await ref.set({name:ME.name,email:ME.email,phone:'',photo:ME.photo,createdAt:Date.now()});
 }
 saveUnread();
}
const myRef=()=>dbFS.collection('customers_app').doc(auth.currentUser.uid);
function saveMe(){myRef().set({name:ME.name,phone:ME.phone,photo:ME.photo},{merge:true}).catch(()=>{})}
function saveUnread(){try{localStorage.setItem('rg_unread',JSON.stringify(unread))}catch(e){}}
const unreadTotal=()=>Object.values(unread).reduce((a,b)=>a+b,0);

/* ================= MUAT BARBERSHOP (acak tiap refresh) ================= */
async function loadShops(){
 SHOPS=[];SHOPS_RAW=[];
 if(S.page==='home'||S.page==='booking')renderSkeleton();
 try{
  const snap=await dbFS.collection('shops').get();
  snap.forEach(doc=>{
   const d=doc.data()||{};
   const p=d.profile||{},s=d.shop||{};
   if(!d.email)return; // hanya toko dengan email (rute reservasi valid)
   SHOPS_RAW.push({
    uid:doc.id,email:d.email,
    name:(s.name||p.name||'Barbershop'),
    photo:p.photo||'',bg:p.bg||'',address:p.address||'',maps:p.maps||'',
    gallery:Array.isArray(p.gallery)?p.gallery.slice(0,9):[],
    capsters:Array.isArray(d.capsters)?d.capsters:[],
    services:Array.isArray(d.services)?d.services:[],
    plan:d.plan||''
   });
  });
  SHOPS=shuffle(SHOPS_RAW.slice()); // acak setiap kali halaman dimuat
  if(S.page==='home')renderShopList();
  if(S.page==='booking')render();
  if(SHOPS_RAW.length)push({icon:'store',title:SHOPS_RAW.length+' barbershop tersedia',sub:'Daftar diacak setiap kali kamu membuka aplikasi.',silent:true});
 }catch(e){
  toast('Gagal memuat daftar barbershop: '+(e.message||e),'alert-triangle',true);
 }
}

async function renderThreads(){
 const el=qs('#thrList');if(!el)return;
 let threads=[];
 try{
  const snap=await dbFS.collection('userChats').doc(auth.currentUser.uid).get();
  const d=snap.exists?snap.data():{threads:{}};
  threads=Object.entries(d.threads||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
 }catch(e){}
 el.innerHTML=threads.length?threads.map(t=>`
  <button class="thr" onclick="openThreadKey('${esc(t.key)}')">
   ${avaHTML('',t.shopName,40).replace('class="pav"','class="pav" style="width:40px;height:40px"')}

   <span class="tm"><small style="color:var(--tx3)">${t.lastAt?ftime(t.lastAt):''}</small>
   ${unread[t.shopEmail]?`<span class="unb">${unread[t.shopEmail]}</span>`:''}</span>
  </button>`).join('')
 :'<div class="empty"><i data-lucide="message-circle"></i><p>Belum ada percakapan.<br>Ketuk tombol Chat pada barbershop untuk memulai.</p></div>';
 refreshIcons();
}

  <div class="room">
   <div class="cr-head">
    <button class="ibtn cr-back" onclick="S.chatShop=null;render()"><i data-lucide="arrow-left"></i></button>
    ${avaHTML(s.photo,s.name,38).replace('class="pav"','class="pav" style="width:38px;height:38px;border-radius:50%"')}
    <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(s.name)}</b>
     <div style="font-size:10.5px;color:var(--tx3)">Balasan dari barbershop · real-time</div></div>
   </div>
   <div class="msgs" id="msgs"><div class="empty" style="padding:26px 10px"><i data-lucide="loader-2"></i><p>Memuat pesan...</p></div></div>
   <div class="chat-inp">
    <input id="chatMsg" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendCustMsg()">
    <button class="btn pri" style="width:44px;padding:0" onclick="sendCustMsg()"><i data-lucide="send"></i></button>
   </div>
  </div>
 </div>`;
}
function bindRoom(){
 const s=S.chatShop;if(!s)return;
 if(unsubThread){unsubThread();unsubThread=null}
 delete unread[s.email];saveUnread();renderNav();
 unsubThread=dbFS.collection('chats').doc(s.email).collection('threads').doc(auth.currentUser.uid)
  .collection('messages').orderBy('at')
  .onSnapshot(snap=>{
   const box=qs('#msgs');if(!box)return;
   const msgs=snap.docs.map(d=>d.data());
   box.innerHTML=msgs.length?msgs.map(m=>`<div class="bub ${m.from==='cust'?'me':'cust'}">${esc(m.text)}<span class="bt">${ftime(m.at)}</span></div>`).join('')
   :'<div class="empty" style="padding:26px 10px"><i data-lucide="message-circle"></i><p>Belum ada pesan.<br>Sapa barbershop ini dulu!</p></div>';
   box.scrollTop=box.scrollHeight;
   refreshIcons();
  },err=>{console.warn(err)});
}
async function sendCustMsg(){
 const s=S.chatShop;if(!s)return;
 const inp=qs('#chatMsg');const text=(inp.value||'').trim();
 if(!text)return;
 inp.value='';
 try{
  await dbFS.collection('chats').doc(s.email).collection('threads').doc(auth.currentUser.uid)
   .collection('messages').add({from:'cust',text,at:Date.now(),name:ME.name});
  await dbFS.collection('chats').doc(s.email).collection('threads').doc(auth.currentUser.uid)
   .set({customerName:ME.name,customerPhone:ME.phone||'',lastText:text,lastFrom:'cust',lastAt:Date.now()},{merge:true});
  await dbFS.collection('userChats').doc(auth.currentUser.uid)
   .set({threads:{[s.email]:{shopEmail:s.email,shopName:s.name,lastText:text,lastAt:Date.now()}}},{merge:true});
 }catch(e){
  toast('Gagal mengirim: '+(e.message||e),'alert-triangle',true);
 }
}

/* ---------- HISTORY ---------- */
const ST_MAP={new:['Menunggu','b-pend'],received:['Diterima','b-gold'],confirmed:['Dikonfirmasi','b-paid'],done:['Selesai','b-paid'],cancelled:['Dibatalkan','b-can']};
VIEWS.history=()=>`
 <div class="phead"><h1>History</h1><p>Seluruh reservasi yang pernah kamu buat.</p></div>
 <div class="card" style="padding:8px 16px" id="histBox"><div class="empty"><i data-lucide="loader-2"></i><p>Memuat...</p></div></div>`;
BIND.history=()=>loadHistory();
async function loadHistory(){
 const el=qs('#histBox');if(!el)return;
 try{
  const snap=await dbFS.collection('reservations').where('customerUid','==',auth.currentUser.uid).get();
  myResvs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 }catch(e){
  el.innerHTML='<div class="empty"><p>Gagal memuat: '+esc(e.message||e)+'</p></div>';return;
 }
 el.innerHTML=myResvs.length?myResvs.map(r=>{
  const st=ST_MAP[r.status]||['Menunggu','b-gray'];
  const when=(r.dateStr||'')+' · '+(r.timeStr||'');
  const cancellable=r.status==='new'||r.status==='received';
  return `<div class="hrow">
   <span class="pav" style="width:38px;height:38px;font-size:13px">${esc((r.shopName||'B')[0].toUpperCase())}</span>
   <div class="in"><b>${esc(r.shopName||'Barbershop')}</b>
    <small>${esc(r.serviceName||'-')} · ${esc(r.capsterName||'Capster acak')}</small>
    <small style="display:block">${esc(when)} · dikirim ${r.createdAt?fdate(r.createdAt):''}</small></div>
   <span class="amt">${r.timeStr?ftime(new Date(r.dateStr+'T'+r.timeStr)):''}</span>
   <span class="badge ${st[1]}">${st[0]}</span>
   ${cancellable?`<button class="ibtn" style="color:var(--dn)" title="Batalkan" onclick="cancelResv('${r.id}')"><i data-lucide="x"></i></button>`:''}
  </div>`;
 }).join('')
 :'<div class="empty"><i data-lucide="clock"></i><p>Belum ada reservasi.<br>Buat booking pertamamu dari menu Booking!</p></div>';
 refreshIcons();
}
async function cancelResv(id){
 if(!confirm('Batalkan reservasi ini?'))return;
 try{
  await dbFS.collection('reservations').doc(id).update({status:'cancelled',cancelledAt:Date.now()});
  toast('Reservasi dibatalkan.','x-circle');
  loadHistory();
 }catch(e){toast('Gagal membatalkan: '+(e.message||e),'alert-triangle',true)}
}

/* ================= DETAIL BARBERSHOP ================= */
function openDetail(uid){
 const s=shopByUid(uid);if(!s)return;
 const cover=s.bg||(s.gallery&&s.gallery[0])||'';
 const svc=(s.services||[]).map(x=>`<div class="svcrow"><span>${esc(x.name)}</span><span class="pr">${fmt(x.price)}</span></div>`).join('')||'<div class="empty" style="padding:14px"><p>Belum ada daftar layanan.</p></div>';
 const caps=(s.capsters||[]).map(c=>{
  const st=c.status==='avail'?['var(--gr)','Available']:c.status==='serv'?['var(--wn)','Serving']:['var(--tx3)','Off'];
  return `<div class="caprow">${avaHTML(c.photo,c.name,38).replace('class="pav"','class="cav"')}
   <div style="flex:1;min-width:0"><b>${esc(c.name)}</b><small>${esc(c.desc||'')}</small></div>
   <span class="cdot" style="background:${st[0]}" title="${st[1]}"></span></div>`;
 }).join('')||'<div class="empty" style="padding:14px"><p>Belum ada data kapster.</p></div>';
 const gal=(s.gallery||[]).length?`<div class="blk">Gallery</div><div class="galrow">${s.gallery.map(g=>`<img src="${esc(g)}" alt="">`).join('')}</div>`:'';
 openModal(`
  <div class="dcover">${cover?`<img src="${esc(cover)}" alt="" onerror="this.parentNode.style.background='linear-gradient(120deg,#0B2FD1,#2563EB)';this.remove()">`:''}</div>
  <div class="dhead">${avaHTML(s.photo,s.name,56).replace('class="pav"','class="dava"')}
   <div style="min-width:0;flex:1;padding-bottom:2px"><h3>${esc(s.name)}</h3>
   ${s.address?`<div class="saddr" style="margin-top:2px"><i data-lucide="map-pin"></i>${esc(s.address)}</div>`:''}</div>
  </div>
  ${gal}
  <div class="blk">Kapster</div>${caps}
  <div class="blk">Layanan &amp; Harga</div>${svc}
  <div class="mrow" style="justify-content:center">
   <button class="btn gho" onclick="closeModal();startChat('${s.uid}')"><i data-lucide="message-circle"></i> Chat</button>
   <button class="btn pri" onclick="openBooking('${s.uid}')"><i data-lucide="calendar-check"></i> Reservasi</button>
  </div>`);
}

/* ================= FORM RESERVASI → FIRESTORE ================= */
function openBooking(uid){
 const s=shopByUid(uid);if(!s)return;
 closePanels();
 const today=dkey(Date.now());
 const svcField=(s.services&&s.services.length)
  ?`<label class="f">Layanan</label><select id="bkSvc">${s.services.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} — ${fmt(x.price)}</option>`).join('')}</select>`
  :`<label class="f">Layanan yang Diinginkan</label><input id="bkSvcTxt" placeholder="Contoh: Potong rambut">`;
 const caps=(s.capsters||[]).filter(c=>c.status!=='off');
 const capField=caps.length
  ?`<label class="f">Capster</label><select id="bkCap"><option value="">Siapa saja (direkomendasikan)</option>${caps.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>`
  :`<label class="f">Preferensi Kapster (opsional)</label><input id="bkCapTxt" placeholder="Kosongkan jika siapa saja boleh">`;
 openModal(`
  <h3>Reservasi</h3>
  <div class="msub">${esc(s.name)}${s.address?' · '+esc(s.address):''}</div>
  <label class="f">Nama Kamu</label><input id="bkName" value="${esc(ME.name||'')}" placeholder="Nama lengkap">
  <label class="f">No. WhatsApp / HP</label><input id="bkPhone" type="tel" value="${esc(ME.phone||'')}" placeholder="08xxxxxxxxxx">
  ${svcField}
  ${capField}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
   <div><label class="f">Tanggal</label><input id="bkDate" type="date" min="${today}" value="${today}"></div>
   <div><label class="f">Jam</label><input id="bkTime" type="time" value="19:00"></div>
  </div>
  <label class="f">Catatan (opsional)</label>
  <textarea id="bkNote" rows="2" placeholder="Contoh: datang berdua, minta yang sabar :)"></textarea>
  <div class="okbox hide" id="bkOk"><i data-lucide="check-circle-2" style="width:16px;height:16px;flex:none"></i><span>Reservasi terkirim! Barbershop menerima notifikasi langsung dan akan mengonfirmasi jadwal.</span></div>
  <div class="mrow">
   <button class="btn gho" onclick="closeModal()">Batal</button>
   <button class="btn pri" id="bkBtn" onclick="submitBooking('${s.uid}')"><i data-lucide="send"></i> Kirim Reservasi</button>
  </div>`);
 if(!ME.phone)setTimeout(()=>qs('#bkName').focus(),80);
}
async function submitBooking(uid){
 const s=shopByUid(uid);if(!s)return;
 const name=qv('#bkName'),phone=qv('#bkPhone'),
  service=(qs('#bkSvc')?qs('#bkSvc').value:qv('#bkSvcTxt')),
  cap=(qs('#bkCap')?qs('#bkCap').value:qv('#bkCapTxt')),
  date=qv('#bkDate'),time=qv('#bkTime'),note=qv('#bkNote');
 if(name.length<2)return toast('Isi nama kamu.','alert-triangle',true);
 if(phone.replace(/\D/g,'').length<9)return toast('No. HP tidak valid.','alert-triangle',true);
 if(!service)return toast('Isi layanan yang diinginkan.','alert-triangle',true);
 if(!date||!time)return toast('Pilih tanggal dan jam.','alert-triangle',true);
 const btn=qs('#bkBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Mengirim...';
 try{
  await dbFS.collection('reservations').add({
   shopEmail:s.email,shopName:s.name,
   customerUid:auth.currentUser.uid,
   name,phone,serviceName:service,capsterName:cap||'',
   dateStr:date,timeStr:time,note,
   status:'new',createdAt:Date.now(),source:'customerapp'
  });
  ME.name=name;ME.phone=phone;saveMe();
  const ok=qs('#bkOk');if(ok)ok.classList.remove('hide');
  push({icon:'calendar-check',title:'Reservasi terkirim',sub:s.name+' · '+service+' · '+time,action:'Lihat History',dur:6000,onClick:()=>{closeModal();go('history')}});
  setTimeout(()=>{closeModal();go('history')},1400);
 }catch(e){
  toast('Gagal mengirim reservasi: '+(e.message||e),'alert-triangle',true);
  btn.disabled=false;btn.innerHTML='<i data-lucide="send"></i> Kirim Reservasi';refreshIcons();
 }
}

/* ================= PROFILE MODALS ================= */

 openModal(`
  <h3>Profile Saya</h3>
  <div class="msub">Akun Google · tersinkron via Firestore</div>
  <div style="display:flex;align-items:center;gap:14px;margin:14px 0 6px">
   ${avaHTML(ME.photo,ME.name,58)}
   <div><b style="font-size:15.5px">${esc(ME.name||'—')}</b>
    <div class="mono" style="font-size:11px;color:var(--tx2)">${esc(ME.email||'')}</div>
    <div class="mono" style="font-size:11px;color:var(--tx2)">${esc(ME.phone||'Belum ada No. HP')}</div></div>
  </div>
  <div class="blk">Statistik</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
   <div style="background:var(--hov);border-radius:10px;padding:12px"><div class="blk" style="margin:0 0 2px">Reservasi</div><b style="font-size:19px">${myResvs.length||'…'}</b></div>
   <div style="background:var(--hov);border-radius:10px;padding:12px"><div class="blk" style="margin:0 0 2px">Percakapan</div><b style="font-size:19px">${Object.keys(unread).length?Object.keys(unread).length:'…'}</b></div>
  </div>
  <div class="mrow"><button class="btn pri" onclick="closeModal();editProfile()"><i data-lucide="pencil"></i> Edit Profile</button></div>`);

function editProfile(){
 openModal(`
  <h3>Edit Profile</h3>
  <div class="msub">Foto diunggah ke Cloudinary · data ke Firestore</div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
   <div class="photopick" id="epAva" onclick="qs('#epPhoto').click()" style="width:64px;height:64px;border:1.5px dashed var(--tx3);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--tx3)">
    ${ME.photo?`<img src="${esc(ME.photo)}" style="width:100%;height:100%;object-fit:cover">`:'<i data-lucide="camera"></i>'}
   </div>
   <input id="epPhoto" type="file" accept="image/*" class="hide" onchange="epPick(this)">
   <small style="font-size:11.5px;color:var(--tx2)">Ketuk lingkaran untuk ganti foto profil.</small>
  </div>
  <label class="f">Nama</label><input id="epName" value="${esc(ME.name||'')}" placeholder="Nama lengkap">
  <label class="f">No. WhatsApp / HP</label><input id="epPhone" type="tel" value="${esc(ME.phone||'')}" placeholder="08xxxxxxxxxx">
  <label class="f">Email (Google)</label><input value="${esc(ME.email||'')}" disabled style="opacity:.6">
  <div class="mrow">
   <button class="btn gho" onclick="closeModal()">Batal</button>
   <button class="btn pri" id="epSave" onclick="epSave()">Simpan</button>
  </div>`);
}
async function epPick(input){
 const f=input.files[0];if(!f)return;
 const holder=qs('#epAva');
 holder.innerHTML=`<img src="${URL.createObjectURL(f)}" style="width:100%;height:100%;object-fit:cover">`;
 toast('Mengunggah foto ke Cloudinary...','upload');
 try{
  const url=await cloudUpload(f);
  ME.photo=url;saveMe();
  holder.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  toast('Foto profil diperbarui.','image');
 }catch(e){toast('Upload gagal: '+(e.message||e),'alert-triangle',true)}
}
function epSave(){
 const name=qv('#epName'),phone=qv('#epPhone');
 if(name.length<2)return toast('Nama terlalu pendek.','alert-triangle',true);
 if(phone&&phone.replace(/\D/g,'').length<9)return toast('No. HP tidak valid.','alert-triangle',true);
 ME.name=name;ME.phone=phone;saveMe();
 closeModal();render();renderNav();
 toast('Profil diperbarui.','check-circle-2');
}
function openSettings(){
 const dark=document.body.classList.contains('dark');
 openModal(`
  <h3>Pengaturan</h3>
  <div class="msub">Preferensi aplikasi reservasi</div>
  <div style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)">
   <i data-lucide="${dark?'sun':'moon'}" style="color:var(--blue)"></i>
   <div style="flex:1"><b style="font-size:13px">Mode ${dark?'Terang':'Gelap'}</b><div style="font-size:11px;color:var(--tx2)">Ketuk untuk beralih tema</div></div>
   <div class="sw ${dark?'on':''}" id="setSw" onclick="toggleTheme()" style="width:40px;height:23px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;flex:none"></div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)">
   <i data-lucide="shuffle" style="color:var(--blue)"></i>
   <div style="flex:1"><b style="font-size:13px">Acak daftar barbershop</b><div style="font-size:11px;color:var(--tx2)">Aktif — daftar diacak setiap refresh</div></div>
   <span class="badge b-paid">ON</span>
  </div>
  <div style="padding:14px 0 2px;text-align:center">
   <div style="width:38px;height:38px;margin:0 auto 8px">${LOGO_SVG}</div>
   <b>BarberGo Reservasi</b>
   <div class="mono" style="font-size:10px;color:var(--tx3);letter-spacing:.12em;margin-top:2px">VERSI 1.0.0 · FIRESTORE · CLOUDINARY</div>
  </div>
  <div class="mrow"><button class="btn gho" onclick="closeModal()">Tutup</button></div>`);
 const sw=qs('#setSw');
 if(sw){sw.innerHTML='';const knob=document.createElement('span');
  knob.style.cssText='position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(15,23,42,.2)';
  sw.appendChild(knob);if(dark){knob.style.left='20px';sw.style.background='var(--blue)'}}
 refreshIcons();
}
function toggleTheme(){
 const dark=document.body.classList.toggle('dark');
 localStorage.setItem('rg_theme',dark?'dark':'light');
 openSettings();renderNav();
 toast('Mode '+(dark?'gelap':'terang')+' aktif.',dark?'moon':'sun');
}

/* ================= THEME / BOOT ================= */
function applyTheme(){document.body.classList.toggle('dark',(localStorage.getItem('rg_theme')||'light')==='dark')}
applyTheme();
refreshIcons();

auth.onAuthStateChanged(async user=>{
 if(user){
  qs('#login').classList.add('hide');
  qs('#app').classList.remove('hide');
  await ensureProfile(user);
  render();
  await loadShops();
  loadHistory().catch(()=>{});
 }else{
  qs('#app').classList.add('hide');
  qs('#login').classList.remove('hide');
  const b=qs('#gBtn');
  b.disabled=false;b.innerHTML='<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""><span>Lanjutkan dengan Google</span>';
 }
});
</script>
